name: release
on:
  push:
    branches: [main]
    paths: [video/**, module/**, scripts/**, .github/workflows/release.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg zip
      - run: scripts/build.sh
      - name: changelog
        run: |
          read VER CODE < out/version
          echo "VER=$VER" >> $GITHUB_ENV
          { echo "## $VER"; echo; git log -1 --pretty='- %s'; } > out/changelog.md
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VER" out/u30p-boot-video.zip \
            --target "$GITHUB_SHA" --title "$VER" --notes-file out/changelog.md --latest
