name: release
on:
  push:
    branches: [main]
    paths: [video/**, module/**, scripts/**, .github/workflows/release.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg zip
      - run: scripts/build.sh
      - name: update.json + changelog
        run: |
          read VER CODE < out/version
          echo "VER=$VER" >> $GITHUB_ENV
          REPO_URL=https://github.com/${{ github.repository }}
          cat > out/update.json <<JSON
          {
            "version": "$VER",
            "versionCode": $CODE,
            "zipUrl": "$REPO_URL/releases/download/$VER/u30p-boot-video.zip",
            "changelog": "$REPO_URL/releases/download/$VER/changelog.md"
          }
          JSON
          { echo "## $VER"; echo; git log -1 --pretty='- %s'; } > out/changelog.md
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VER" out/u30p-boot-video.zip out/update.json out/changelog.md \
            --target "$GITHUB_SHA" --title "$VER" --notes-file out/changelog.md --latest
